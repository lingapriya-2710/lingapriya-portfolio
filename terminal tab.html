<section class="tab-page" id="tab-terminal">
      <div class="terminal-wrapper">
        <div class="terminal-topbar">
          <span class="dot red"></span>
          <span class="dot yellow"></span>
          <span class="dot green"></span>
          <span class="term-title">Query Linga Priya — bash</span>
          <button class="term-clear" id="termClear">clear</button>
        </div>
        <div class="terminal-quick-btns">
          <span class="qlabel">Quick →</span>
          <button class="qbtn" data-cmd="about">about</button>
          <button class="qbtn" data-cmd="skills">skills</button>
          <button class="qbtn" data-cmd="projects">projects</button>
          <button class="qbtn" data-cmd="contact">contact</button>
          <button class="qbtn" data-cmd="fun">fun</button>
        </div>
        <div class="terminal-output" id="termOutput">
          <div class="term-line"><span class="prompt">▶</span> Welcome to Linga Priya's interactive portfolio</div>
          <div class="term-line"><span class="prompt">▶</span> Type <span class="hl">'root'</span> for all commands</div>
        </div>
        <div class="terminal-input-row">
          <span class="term-cwd">~/</span>
          <input type="text" id="termInput" class="term-input" placeholder="type a command..." autocomplete="off" spellcheck="false" />
          <span class="term-enter">↵ Enter</span>
        </div>
      </div>
    </section>
