            <p class="contact-intro">Have a project, opportunity, or just want to say hi? My inbox is always open!</p>
            <div class="contact-links">

          <form class="contact-form" id="contactForm" action="https://formspree.io/f/xdavkqlz" method="POST">

              <input type="text" id="name" name="name" placeholder="e.g. Arjun Kumar" required />
            </div>
            <div class="form-group">
              <label for="email">Your Email</label>
              <input type="email" id="email" name="email" placeholder="you@example.com" required />
            </div>
            <div class="form-group">
              <label for="subject">Subject</label>
              <input type="text" id="subject" name="subject" placeholder="What's it about?" />
            </div>
            <div class="form-group">
              <label for="message">Message</label>
              <textarea id="message" name="message" rows="5" placeholder="Tell me more..." required></textarea>
            </div>
            <button type="submit" class="submit-btn" id="submitBtn">
              <span id="submitText">Send Message</span>
              <span class="btn-arrow">→</span>
            </button>
            <div class="form-status" id="formStatus"></div>
          </form>
        </div>
