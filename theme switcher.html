<div class="theme-switcher" id="themeSwitcher">
    <button class="theme-toggle-btn" id="themeToggleBtn" title="Switch Theme">
      <span class="theme-icon">◑</span>
    </button>
    <div class="theme-panel" id="themePanel">
      <p class="theme-label">THEMES</p>
      <button class="theme-btn active" data-theme="cyber">⚡ Cyber</button>
      <button class="theme-btn" data-theme="aurora">🌌 Aurora</button>
      <button class="theme-btn" data-theme="solar">☀️ Solar</button>
      <button class="theme-btn" data-theme="mint">🌿 Mint</button>
      <button class="theme-btn" data-theme="rose">🌸 Rose</button>
    </div>
  </div>
